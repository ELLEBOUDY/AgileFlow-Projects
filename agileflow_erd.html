
<div id="erd" style="padding: 1rem 0"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});

const diagram = `erDiagram
  USER {
    int id PK
    string username
    string email UK
    string password
    string role
    string first_name
    string last_name
  }
  PASSWORD_RESET_TOKEN {
    int id PK
    int user_id FK
    string code_hash
    datetime created_at
    datetime expires_at
    datetime verified_at
    datetime used_at
  }
  TEAM {
    int id PK
    string team_name
    string description
    int manager_id FK
    datetime created_at
  }
  TEAM_MEMBERS {
    int team_id FK
    int user_id FK
  }
  PROJECT {
    int id PK
    string project_name
    string description
    date start_date
    date end_date
    string status
    int progress
    int team_id FK
    datetime created_at
  }
  TASK {
    int id PK
    string task_title
    string description
    string priority
    string status
    date deadline
    int project_id FK
    int assigned_to FK
    datetime created_at
  }
  COMMENT {
    int id PK
    text content
    int task_id FK
    int user_id FK
    datetime created_at
  }
  FILE {
    int id PK
    string file_name
    string file_path
    int uploaded_by FK
    int task_id FK
    datetime upload_date
  }
  NOTIFICATION {
    int id PK
    int user_id FK
    text message
    bool is_read
    datetime timestamp
  }

  USER ||--o{ PASSWORD_RESET_TOKEN : "has"
  USER ||--o{ TEAM : "manages"
  USER ||--o{ TEAM_MEMBERS : "joins"
  TEAM ||--o{ TEAM_MEMBERS : "has"
  TEAM ||--o{ PROJECT : "owns"
  PROJECT ||--o{ TASK : "contains"
  USER ||--o{ TASK : "assigned"
  TASK ||--o{ COMMENT : "has"
  USER ||--o{ COMMENT : "writes"
  TASK ||--o{ FILE : "has"
  USER ||--o{ FILE : "uploads"
  USER ||--o{ NOTIFICATION : "receives"
`;

const { svg } = await mermaid.render('erd-svg', diagram);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg .row-rect-odd path, #erd svg .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
